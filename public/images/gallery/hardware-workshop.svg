      <rect x="150" y="-18" width="12" height="22" rx="4"/>
      <rect x="186" y="-18" width="12" height="22" rx="4"/>

      <rect x="42" y="236" width="12" height="22" rx="4"/>
      <rect x="78" y="236" width="12" height="22" rx="4"/>
      <rect x="114" y="236" width="12" height="22" rx="4"/>
      <rect x="150" y="236" width="12" height="22" rx="4"/>
      <rect x="186" y="236" width="12" height="22" rx="4"/>

      <rect x="-18" y="42" width="22" height="12" rx="4"/>
      <rect x="-18" y="78" width="22" height="12" rx="4"/>
      <rect x="-18" y="114" width="22" height="12" rx="4"/>
      <rect x="-18" y="150" width="22" height="12" rx="4"/>
      <rect x="-18" y="186" width="22" height="12" rx="4"/>

