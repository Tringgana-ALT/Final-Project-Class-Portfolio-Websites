<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Ilustrasi Praktikum Hardware Kelas 10 RPL">
  <defs>
    <linearGradient id="bg-hw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="55%" stop-color="#082F49"/>
      <stop offset="100%" stop-color="#0E7490"/>
