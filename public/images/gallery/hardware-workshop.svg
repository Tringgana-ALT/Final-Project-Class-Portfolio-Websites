    <rect x="36" y="36" width="168" height="168" rx="18" fill="#075985" stroke="#38BDF8" stroke-opacity="0.7" stroke-width="2"/>
    <rect x="70" y="70" width="100" height="100" rx="14" fill="#06182A"/>
    <circle cx="120" cy="120" r="24" fill="none" stroke="#34D399" stroke-width="3"/>
