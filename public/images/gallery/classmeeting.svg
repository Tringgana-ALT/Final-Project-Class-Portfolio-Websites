  <path d="M40 70 Q 480 120 920 70" fill="none" stroke="#E0F2FE" stroke-opacity="0.45" stroke-width="2.5"/>
  <polygon points="140,80 175,84 155,116" fill="#38BDF8"/>
  <polygon points="240,89 275,92 256,124" fill="#FBBF24"/>
  <polygon points="340,95 375,97 357,129" fill="#34D399"/>
  <polygon points="585,97 620,95 603,129" fill="#FBBF24"/>
  <polygon points="685,92 720,89 704,124" fill="#38BDF8"/>
  <polygon points="785,84 820,80 805,116" fill="#34D399"/>

