  </defs>

  <rect width="960" height="540" fill="url(#bg-event)"/>
  <circle cx="480" cy="220" r="190" fill="#7DD3FC" fill-opacity="0.14"/>
  <circle cx="480" cy="220" r="130" fill="#BAE6FD" fill-opacity="0.12"/>

