<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Ilustrasi Lomba 17-an Kelas 10 RPL">
  <defs>
    <linearGradient id="bg-lomba" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4C0519"/>
      <stop offset="48%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <rect width="960" height="540" fill="url(#bg-lomba)"/>
  <circle cx="480" cy="250" r="185" fill="#FBBF24" fill-opacity="0.14"/>

  <!-- Ocean wave base -->
  <path d="M0 400 Q 240 365 480 402 T 960 390 L 960 540 L 0 540 Z" fill="#0A2540" fill-opacity="0.78"/>
  <path d="M0 448 Q 240 422 480 450 T 960 440 L 960 540 L 0 540 Z" fill="#0284C7" fill-opacity="0.35"/>

  <!-- Festive wave ribbon -->
  <path d="M70 140 Q 280 90 480 145 T 890 130" fill="none" stroke="url(#ribbon)" stroke-width="6" stroke-linecap="round"/>

  <!-- Podium & medal/flag motif -->
  <g transform="translate(275, 220)">
    <rect x="0" y="88" width="120" height="92" rx="14" fill="#0C4A6E" stroke="#7DD3FC" stroke-opacity="0.45" stroke-width="2"/>
    <rect x="145" y="42" width="120" height="138" rx="14" fill="#075985" stroke="#FBBF24" stroke-opacity="0.75" stroke-width="2.5"/>
    <rect x="290" y="106" width="120" height="74" rx="14" fill="#0C4A6E" stroke="#7DD3FC" stroke-opacity="0.45" stroke-width="2"/>

    <!-- Flag on center podium -->
    <rect x="197" y="-65" width="7" height="108" rx="3.5" fill="#F8FAFC"/>
    <rect x="204" y="-65" width="84" height="24" rx="3" fill="#E11D48"/>
    <rect x="204" y="-41" width="84" height="24" rx="3" fill="#F8FAFC"/>
  </g>

  <!-- Confetti -->
  <circle cx="220" cy="195" r="7" fill="#FBBF24"/>
  <circle cx="745" cy="185" r="7" fill="#38BDF8"/>
  <rect x="260" y="150" width="14" height="14" rx="3" transform="rotate(24 260 150)" fill="#FB7185"/>
  <rect x="690" y="235" width="14" height="14" rx="3" transform="rotate(-18 690 235)" fill="#34D399"/>
</svg>
